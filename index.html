<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreditSmart</title>

  <meta name="description" content="Compara, simula y solicita créditos de forma segura, clara y 100% en línea." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CreditSmart" />

  <!-- La barra del navegador acompaña al tema en vez de quedarse fija -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07131f" />

  <link rel="icon" type="image/svg+xml" href="/assets/logo/creditsmart-mark.svg" />
  <link rel="manifest" href="/manifest.json" />

  <script>
    /* Aplica el tema guardado ANTES del primer pintado.
       Si se hiciera desde React, la página aparecería un instante en claro
       antes de pasar a oscuro. Sin valor guardado no se toca nada y manda
       `prefers-color-scheme`. */
    (function () {
      try {
        var saved = localStorage.getItem('creditsmart-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (error) {
        /* Modo privado o almacenamiento bloqueado: se queda en automático. */
      }
    })();
  </script>
</head>
<body>
  <!-- Punto de montaje único de React (Composition Root de la presentación).
       Los estilos se importan desde src/main.jsx para que Vite los empaquete
       respetando la cascada: reset -> tokens -> base -> layout -> componentes
       -> páginas -> responsive. -->
  <div id="root">
    <div class="app-boot">
      <div class="spinner" role="status" aria-label="Cargando"></div>
    </div>
  </div>

  <!-- Región viva para notificaciones accesibles (puerto INotifier) -->
  <div id="notifications" class="notifications" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">
      <strong>CreditSmart</strong>
      <p>Esta aplicación requiere JavaScript habilitado para funcionar.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
